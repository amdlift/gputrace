[workspace]
resolver = "3"
members = ["crates/gputrace-core", "crates/gputrace-shim", "crates/gputrace"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/amdlift/gputrace"

[workspace.dependencies]
gputrace-core = { path = "crates/gputrace-core" }
libloading = "0.9.0"
serde = { version = "1", features = ["derive"] }
clap = { version = "4", features = ["derive"] }
postcard = { version = "1.1", features = ["use-std"] }
serde_json = "1"
blake3 = "1"
thiserror = "2"
tempfile = "3"
